# =============================================================================
# Profile: prod
# Azure AKS Production + Azure Database for PostgreSQL (Flexible Server)
#
# Activate on AKS via ConfigMap:
#   SPRING_PROFILES_ACTIVE=prod
#
# Prefer private endpoint / VNet integration for the Postgres server in prod.
# =============================================================================

spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

server:
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    com.example.demo: INFO
    org.flywaydb: WARN

management:
  endpoint:
    health:
      show-details: never
