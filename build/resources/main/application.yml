# =============================================================================
# Base Spring Boot configuration (shared across all profiles)
#
# Active profile via SPRING_PROFILES_ACTIVE:
#   local  – developer laptop (Docker Compose Postgres)
#   dev    – Azure AKS Development  + Azure Database for PostgreSQL (dev)
#   sit    – Azure AKS SIT          + Azure Database for PostgreSQL (sit)
#   prod   – Azure AKS Production   + Azure Database for PostgreSQL (prod)
# =============================================================================

spring:
  application:
    name: customers

  profiles:
    default: local

  # Logical environment name (overridden per profile / APP_ENVIRONMENT)
  # Used for observability; not required by business logic.

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/customers}
    username: ${SPRING_DATASOURCE_USERNAME:customers}
    password: ${SPRING_DATASOURCE_PASSWORD:customers}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Isolate from other apps sharing the same Azure Postgres database
        default_schema: ${DB_SCHEMA:customers}
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Own schema + flyway_schema_history (safe to share demo_dev / same server)
    schemas: ${DB_SCHEMA:customers}
    default-schema: ${DB_SCHEMA:customers}
    create-schemas: true


  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Jackson 3 / Spring Boot 4: date features moved under datatype.datetime
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    version: 0.0.1-SNAPSHOT

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.demo: ${LOG_LEVEL_APP:INFO}
