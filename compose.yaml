name: spring-postgres-demo
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_USER: ${POSTGRES_USER:-demo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo_user} -d ${POSTGRES_DB:-demo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [demo-network]
  app:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-demo}
      DB_USERNAME: ${POSTGRES_USER:-demo_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-demo_password}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [demo-network]
volumes:
  postgres-data:
networks:
  demo-network:
