# TEMPLATE ONLY — not applied by kustomize. CI creates customers-config from GH vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: customers-config
  labels:
    app.kubernetes.io/name: customers
    environment: prod
data:
  SPRING_PROFILES_ACTIVE: "prod"
  APP_ENVIRONMENT: "prod"
  SERVER_PORT: "8080"
  DB_POOL_MAX_SIZE: "20"
  DB_POOL_MIN_IDLE: "5"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://<pg-server>.postgres.database.azure.com:5432/customers_prod?sslmode=require"
