apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customers
  labels:
    app.kubernetes.io/name: customers
    environment: dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: customers-dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customers
                port:
                  number: 80
